# EyalSec status: https://github.com/EyalSec/status
# Configuration reference: https://upptime.js.org/docs/configuration
owner: EyalSec
repo: status
user-agent: eyal-gabay

# Every check is a plain GET from GitHub's hosted runners, every five minutes.
sites:
  - name: Website
    url: https://eyalsec.com
  - name: Dashboard and API
    url: https://eyalsec.com/healthz
    __dangerous__body_down_if_text_missing: "ok"
  - name: Documentation
    url: https://eyalsec.com/docs

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 23 * * *"
  graphs: "0 0 * * *"
  summary: "0 0 * * *"
  staticSite: "0 1 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"

skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true
skipPoweredByReadme: true

status-website:
  # Served at https://eyalsec.github.io/status until status.eyalsec.com points
  # at GitHub Pages. Switching over replaces the baseUrl line with
  # `cname: status.eyalsec.com` (see the open "Serve at status.eyalsec.com" PR).
  baseUrl: /status
  name: EyalSec status
  logoUrl: https://raw.githubusercontent.com/EyalSec/status/master/assets/eyalsec-shield.png
  logoHref: https://eyalsec.com
  favicon: https://raw.githubusercontent.com/EyalSec/status/master/assets/eyalsec-icon-192.png
  introTitle: "Live availability of the EyalSec website, dashboard and docs."
  introMessage: "Each service is checked every five minutes. When a check fails, an incident opens here on its own and closes when the service answers again. If something looks wrong on your side, write to support@eyalsec.com and we will look into it with you."
  navbar:
    - title: Status
      href: ./
    - title: eyalsec.com
      href: https://eyalsec.com
    - title: Book a live demo
      href: https://eyalsec.com/contact
  metaTags:
    - name: description
      content: "Live availability of the EyalSec website, dashboard, API and docs, checked every five minutes."
  theme: dark
  css: >-
    :root:root{--body-background-color:#111310;--body-text-color:#f2f1ea;--card-background-color:#181a15;--nav-background-color:#14160f;--nav-border-bottom-color:#2a2c27;--nav-current-border-bottom-color:#e8b04b;--card-border-color:#2a2c27;--down-border-left-color:#d64545;--down-background-color:#3a1717;--degraded-border-left-color:#e8b04b;--up-border-left-color:#8bbf6b;--tag-color:#111310;--tag-up-background-color:#8bbf6b;--tag-down-background-color:#d64545;--tag-degraded-background-color:#e8b04b;--change-background-color:#e8b04b;--error-button-border-color:#c9a15e;--error-button-background-color:#e8b04b;--error-button-color:#111310;--submit-button-border-color:#c9a15e;--submit-button-background-color:#e8b04b;--submit-button-color:#111310;--graph-opacity:1;--graph-filter:none}
    body{background:#111310;color:#b6b8ad}
    h1,h2,h4,nav .logo div{color:#f2f1ea}
    h1 strong,h2 strong{color:#e8b04b;font-weight:600}
    a:focus-visible{outline:2px solid #e8b04b;outline-offset:2px}
    article.graph[class]{background-image:none !important;isolation:isolate}
    article.graph[class]::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-color:#e8b04b;-webkit-mask-image:var(--background);mask-image:var(--background);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center right;mask-position:center right;opacity:.35}
    @media (max-width:640px){main.container[class]{padding:0 1rem} body nav[class]{padding:0;margin-bottom:1.5rem} nav div.container[class]{flex-wrap:wrap;padding:0 1rem} nav a.logo[href]{margin-right:0;padding:.75rem 0} nav ul[class]{justify-content:flex-start;flex-wrap:wrap;width:100%} nav ul[class] a[href]{padding:.25rem 1.25rem .75rem 0}}

i18n:
  allSystemsOperational: "All systems operational"
  degradedPerformance: "Degraded performance"
  partialOutage: "Partial outage"
  completeOutage: "Complete outage"
  up: "Up"
  down: "Down"
  degraded: "Degraded"
